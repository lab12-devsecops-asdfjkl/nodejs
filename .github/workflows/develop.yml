name: Node.js Develop Pipeline

on:
  push:
    branches: [ develop ]

jobs:
  test:
    runs-on: self-hosted
    name: Test and Lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: nodejs/package-lock.json

      - name: Install dependencies
        working-directory: ./nodejs
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run linter (if configured)
        working-directory: ./nodejs
        run: |
          if npm run lint --if-present; then
            echo "Linting passed"
          else
            echo "No lint script found, skipping"
          fi

      - name: Run tests
        working-directory: ./nodejs
        run: npm test -- --coverage --passWithNoTests
        env:
          NODE_ENV: test
          MYSQL_URI: mysql://test:test@localhost:3306/testdb
          REDIS_URL: redis://localhost:6379

  sonarqube:
    runs-on: self-hosted
    name: SonarQube Code Scan
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: nodejs/package-lock.json

      - name: Install dependencies
        working-directory: ./nodejs
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: ./nodejs

  build:
    runs-on: self-hosted
    name: Build and Push Docker Image
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: registry.gaumeodathanh.me
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./nodejs
          file: ./nodejs/Dockerfile
          push: true
          tags: |
            nodejs-backend:develop
            registry.gaumeodathanh.me/nodejs-backend:develop
          cache-from: type=registry,ref=registry.gaumeodathanh.me/nodejs-backend:buildcache
          cache-to: type=registry,ref=registry.gaumeodathanh.me/nodejs-backend:buildcache,mode=max

  trivy-scan:
    runs-on: self-hosted
    name: Trivy Image Scan
    needs: build
    
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: registry.gaumeodathanh.me/nodejs-backend:develop
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
