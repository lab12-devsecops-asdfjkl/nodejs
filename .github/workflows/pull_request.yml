name: Node.js PR Pipeline

on:
  pull_request:
    branches:
      - main
      - develop
      - staging

jobs:
  sonarqube:
    name: SonarCloud Code Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=lab12-devsecops-asdfjkl
            -Dsonar.projectKey=lab12-devsecops-asdfjkl_nodejs
            -Dsonar.sources=.

  build:
    name: Build Docker Image
    runs-on: self-hosted
    needs: sonarqube

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nodejs-backend:pr-${{ github.event.pull_request.number }}
          cache-from: type=registry,ref=registry.gaumeodathanh.me/nodejs-backend:buildcache
          cache-to: type=inline

  trivy:
    name: Trivy Image Scan
    runs-on: self-hosted
    needs: build

    steps:
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nodejs-backend:pr-${{ github.event.pull_request.number }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
