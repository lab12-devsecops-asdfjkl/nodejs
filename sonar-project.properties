# SonarQube Configuration
sonar.projectKey=lab12-devsecops-asdfjkl_nodejs
sonar.organization=lab12-devsecops-asdfjkl

# Source directories
sonar.sources=.
sonar.exclusions=node_modules/**,coverage/**,dist/**,build/**

# Ignore GitHub Actions version pinning warnings
# Rule: GitHub Actions should be pinned to a full length commit SHA
sonar.issue.ignore.multicriteria=e1,e2

# Ignore yaml:S6819 - GitHub Actions should be pinned
sonar.issue.ignore.multicriteria.e1.ruleKey=yaml:S6819
sonar.issue.ignore.multicriteria.e1.resourceKey=**/.github/workflows/*.yml

# Also ignore docker:S6476 if it appears
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S6476
sonar.issue.ignore.multicriteria.e2.resourceKey=**/.github/workflows/*.yml
